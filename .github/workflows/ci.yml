name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0  # needed for setuptools_scm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yt-dlp

      - name: Install package with dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run ruff (lint)
        run: |
          ruff check .

      - name: Run ruff (format check)
        run: |
          ruff format --check .

      - name: Run mypy (type check) — blocking baseline gate
        run: |
          python scripts/check_mypy_baseline.py

      - name: Check prompts sync (config ↔ resources)
        run: |
          python scripts/check_prompts_sync.py

      - name: Run pytest
        run: |
          pytest -v --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build --wheel --sdist

      - name: Verify package installation
        run: |
          pip install dist/*.whl
          kb-agent --version
          kb-agent --help

  security-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Run security audit (blocking)
        run: |
          # Аудит идёт по изолированному окружению с зависимостями проекта:
          # предустановленные инструменты образа runner'а (pip/setuptools) не
          # относятся к проекту и давали ложные срабатывания.
          # Скрипт завершается с ненулевым кодом, если найдена уязвимость.
          bash scripts/audit_dependencies.sh "${{ runner.temp }}/kb-audit-env"

  sync-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      - name: Check config/resources sync
        run: |
          python -c "
          from kb_agent.config import get_prompt_text, AppConfig
          config = AppConfig()
          for prompt in ['agent_prompt.md', 'answer_prompt.md', 'summarize_prompt.md']:
              text = get_prompt_text(prompt, config)
              if text is None:
                  print(f'ERROR: Prompt {prompt} not found in resources')
                  exit(1)
              print(f'OK: {prompt} ({len(text)} chars)')
          "
          python scripts/check_prompts_sync.py
