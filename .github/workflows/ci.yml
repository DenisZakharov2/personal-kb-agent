name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for setuptools_scm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yt-dlp

      - name: Install package with dev dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run ruff (lint)
        run: |
          ruff check .

      - name: Run mypy (type check)
        run: |
          mypy kb_agent

      - name: Run pytest
        run: |
          pytest -v --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build --wheel --sdist

      - name: Verify package installation
        run: |
          pip install dist/*.whl
          kb-agent --version
          kb-agent --help

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run security audit
        run: |
          pip install -e .
          pip-audit --desc --format=json --output=pip-audit.json || true
          cat pip-audit.json | jq '.vulnerabilities | length' || echo "No vulnerabilities found"

  sync-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package
        run: pip install -e .

      - name: Check config/resources sync
        run: |
          python -c "
          from kb_agent.config import get_prompt_text, AppConfig
          config = AppConfig()
          for prompt in ['agent_prompt.md', 'answer_prompt.md', 'summarize_prompt.md']:
              text = get_prompt_text(prompt, config)
              if text is None:
                  print(f'ERROR: Prompt {prompt} not found in resources')
                  exit(1)
              print(f'OK: {prompt} ({len(text)} chars)')
          "