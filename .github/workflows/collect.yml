name: KB Collect

on:
  schedule:
    - cron: '0 10 * * *'   # ежедневно 10:00 UTC
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp requests beautifulsoup4

      - name: Configure environment
        run: |
          cp .env.example .env
          echo "KB_VAULT_PATH=${{ secrets.KB_VAULT_PATH }}" >> .env
          echo "KB_TELEGRAM_CHANNELS=${{ secrets.KB_TELEGRAM_CHANNELS }}" >> .env
          echo "KB_YT_CHANNEL_URL=${{ secrets.KB_YT_CHANNEL_URL }}" >> .env

      - name: Collect Telegram
        run: python3 scripts/collect_telegram.py

      - name: Collect YouTube metadata
        run: python3 scripts/collect_youtube.py collect

      - name: Collect YouTube transcripts
        run: python3 scripts/collect_youtube.py transcripts

      - name: Archive queue and transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kb-queue
          path: |
            scripts/_queue.jsonl
            scripts/_done.txt
            scripts/_trans_done.txt
            scripts/_transcripts/
