name: KB Collect

on:
  schedule:
    - cron: '0 10 * * *'   # ежедневно 10:00 UTC
  workflow_dispatch:

concurrency:
  group: kb-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read  # для скачивания предыдущего артефакта
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Restore previous state (state.db + vault)
        uses: actions/download-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: kb-state
          path: ${{ runner.temp }}/kb-restore
        continue-on-error: true

      - name: Configure environment
        run: |
          # Все данные конвейера складываем во временную рабочую директорию раннера,
          # чтобы после прогона можно было сохранить артефакты (vault + state.db).
          echo "KB_DATA_DIR=${{ runner.temp }}/kb-data" >> $GITHUB_ENV
          echo "KB_VAULT_PATH=${{ runner.temp }}/kb-vault" >> $GITHUB_ENV
          echo "KB_DB_PATH=${{ runner.temp }}/kb-data/state.db" >> $GITHUB_ENV
          echo "KB_LOG_PATH=${{ runner.temp }}/kb-data/kb_agent.log" >> $GITHUB_ENV
          # Секреты из GitHub Secrets пробрасываем в окружение приложения через $GITHUB_ENV
          # (load_config читает переменные окружения, поэтому .env-файл не нужен).
          # НЕ переопределяем KB_VAULT_PATH из секрета на эфемерном раннере — используем локальный путь.
          echo "KB_TELEGRAM_CHANNELS=${{ secrets.KB_TELEGRAM_CHANNELS }}" >> $GITHUB_ENV
          echo "KB_YOUTUBE_CHANNELS=${{ secrets.KB_YOUTUBE_CHANNELS }}" >> $GITHUB_ENV
          echo "KB_OPENAI_API_KEY=${{ secrets.KB_OPENAI_API_KEY }}" >> $GITHUB_ENV
          echo "KB_OPENAI_BASE_URL=${{ secrets.KB_OPENAI_BASE_URL }}" >> $GITHUB_ENV
          echo "KB_OPENAI_MODEL=${{ secrets.KB_OPENAI_MODEL }}" >> $GITHUB_ENV
          echo "KB_LLM_PROVIDER=${{ secrets.KB_LLM_PROVIDER }}" >> $GITHUB_ENV

      - name: Restore state.db and vault from previous run
        if: always()
        run: |
          mkdir -p "${{ env.KB_VAULT_PATH }}" "${{ runner.temp }}/kb-data"
          # Восстанавливаем state.db, если есть (артефакт содержит kb-data/state.db)
          if [ -f "${{ runner.temp }}/kb-restore/kb-data/state.db" ]; then
            cp "${{ runner.temp }}/kb-restore/kb-data/state.db" "${{ env.KB_DB_PATH }}"
            echo "Restored state.db from previous run"
          fi
          # Восстанавливаем vault полностью (сохраняя структуру папок), если есть
          if [ -d "${{ runner.temp }}/kb-restore/kb-vault" ] && [ "$(ls -A ${{ runner.temp }}/kb-restore/kb-vault)" ]; then
            # Копируем содержимое vault рекурсивно, сохраняя структуру папок
            cp -r "${{ runner.temp }}/kb-restore/kb-vault/." "${{ env.KB_VAULT_PATH }}/" 2>/dev/null || true
            echo "Restored vault from previous run"
          fi

      - name: Run kb-agent pipeline (сбор + суммаризация + индексация)
        run: kb-agent process run

      - name: Show status
        run: kb-agent process status

      - name: Гарантировать существование путей для артефактов
        if: always()
        run: |
          mkdir -p "${{ env.KB_VAULT_PATH }}" "${{ runner.temp }}/kb-data"

      - name: Сохранить артефакты (vault + state.db)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kb-state
          path: |
            ${{ env.KB_VAULT_PATH }}/
            ${{ env.KB_DB_PATH }}
