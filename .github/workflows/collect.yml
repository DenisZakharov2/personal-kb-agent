name: KB Collect

on:
  schedule:
    - cron: '0 10 * * *'   # ежедневно 10:00 UTC
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[youtube]"

      - name: Configure environment
        run: |
          cp .env.example .env
          echo "KB_VAULT_PATH=${{ secrets.KB_VAULT_PATH }}" >> .env
          echo "KB_TELEGRAM_CHANNELS=${{ secrets.KB_TELEGRAM_CHANNELS }}" >> .env
          echo "KB_YOUTUBE_CHANNELS=${{ secrets.KB_YOUTUBE_CHANNELS }}" >> .env

      - name: Run kb-agent pipeline (сбор + суммаризация + индексация)
        run: kb-agent process run

      - name: Show status
        run: kb-agent process status
