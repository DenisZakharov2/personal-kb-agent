name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Lint (ruff check)
        run: ruff check kb_agent scripts tests

      - name: Format (ruff format --check)
        run: ruff format --check kb_agent scripts tests

      - name: Type check (mypy) — blocking baseline gate
        run: python scripts/check_mypy_baseline.py

      - name: Check prompts sync (config ↔ resources)
        run: python scripts/check_prompts_sync.py

      - name: Tests (pytest)
        run: pytest tests/ -q

      - name: Dependency audit (pip-audit, blocking)
        run: bash scripts/audit_dependencies.sh "${{ runner.temp }}/kb-audit-env"

      - name: Build wheel
        run: pip wheel . --no-deps --no-build-isolation
