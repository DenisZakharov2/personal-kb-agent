# Профиль пользователя базы знаний ТГК.
# Создаётся вводным интервью (kb-agent interview init) или заполняется вручную через этот файл.
# При развёртывании копируется в data/user_profile.yaml.
#
# ВАЖНО: структура должна совпадать с той, что читают код (`Pipeline._load_profile`,
# `RelevanceGate`, `InsightsEngine`): все поля лежат внутри секции `user`,
# цель называется `goal` (одна строка), темы — список `topics`.

version: 1

user:
  name: null

  # Цель базы знаний (одна строка)
  goal: Систематизировать материалы по ИИ-агентам и автоматизации для работы и саморазвития

  # Задачи, которые должна решать база знаний
  tasks: Быстро находить релевантную информацию и отслеживать новые инсайты и связи

  # Темы интересов: по ним работает Relevance Gate и подсказка для LLM
  topics:
    - ИИ-агенты и автономные системы
    - LLM и API
    - Автоматизация процессов

  # Источники (id из data/sources.yaml)
  sources:
    - tg_ragnarokzone
    - yt_example_channel

  # Частота сбора (справочно, для cron/напоминаний)
  frequency: daily

  # Система для работы с базой знаний
  system: Obsidian

  # Ядро существующих материалов
  core_materials:
    - path: /home/user/Documents/KB_core
      imported: false
