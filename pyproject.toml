[project]
name = "personal-kb-agent"
version = "0.2.2"
description = "Второй мозг — личный ИИ-агент для базы знаний: сбор из Telegram и YouTube, суммаризация, поиск и доступ для AI-агентов через MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Denis Zakharov", email = "denis@zakharov.dev"}]
keywords = [
    "ai-agent",
    "knowledge-base",
    "obsidian",
    "telegram",
    "youtube",
    "mcp",
    "llm",
    "summarization",
    "personal-knowledge-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0,<3",
    "typer>=0.9,<1",
    "rich>=13,<14",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "beautifulsoup4>=4.12,<5",
    "mcp>=1.0,<2",
    "yt-dlp>=2024.08",
]

[project.urls]
Homepage = "https://github.com/DenisZakharov2/personal-kb-agent"
Repository = "https://github.com/DenisZakharov2/personal-kb-agent"
Issues = "https://github.com/DenisZakharov2/personal-kb-agent/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "ruff>=0.8,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
    "typing-extensions>=4.0,<5",
]

[build-system]
requires = ["setuptools>=84", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kb_agent*"]

[tool.setuptools.package-data]
kb_agent = ["resources/**/*"]

[project.scripts]
kb-agent = "kb_agent.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"
include = ["kb_agent", "scripts", "tests", "*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
implicit_optional = false
strict_optional = true
