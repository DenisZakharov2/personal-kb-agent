[project]
name = "personal-kb-agent"
version = "0.1.0"
description = "Второй мозг — личный ИИ-агент для базы знаний: сбор из Telegram и YouTube, суммаризация, поиск и доступ для AI-агентов через MCP"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Denis Zakharov", email = "denis@zakharov.dev"}]
keywords = [
    "ai-agent",
    "knowledge-base",
    "obsidian",
    "telegram",
    "youtube",
    "mcp",
    "llm",
    "summarization",
    "personal-knowledge-management",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.0,<3",
    "typer>=0.9,<1",
    "rich>=13,<14",
    "httpx>=0.27,<1",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
    "beautifulsoup4>=4.12,<5",
    "mcp>=1.0,<2",
]

[project.optional-dependencies]
youtube = ["yt-dlp>=2024.08,<2026"]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8,<1",
    "mypy>=1.10,<2",
    "pip-audit>=2.7,<3",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kb_agent*"]

[tool.setuptools.package-data]
kb_agent = ["resources/**/*"]

[project.scripts]
kb-agent = "kb_agent.cli.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"
